name: Build & Deploy (Dokploy)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: dokploy-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Trigger Dokploy Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Missing secret DOKPLOY_WEBHOOK_URL" >&2
            exit 1
          fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
